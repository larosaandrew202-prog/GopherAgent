# Serves the built SPA and reverse-proxies the GopherAgent API.
# Same-origin, so no CORS/cookie issues.
server {
    listen 80;
    server_name _;

    root /var/www/gopher-agent;
    index index.html;

    # Hashed build assets can be cached aggressively.
    location /assets/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Never cache the entry HTML.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # OpenAPI spec (not under /api/).
    location = /api.json {
        proxy_pass http://127.0.0.1:9899;
        proxy_set_header Host $host;
    }

    # Backend API + SSE streams.
    location ~ ^/(api|auth|message|stream|cancel|upload|uploads|config|preview|mcp|swagger)(/|$) {
        proxy_pass http://127.0.0.1:9899;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        # SSE (/stream, /api/logs) must not be buffered.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
