# https://goframe.org/docs/web/server-config-file-template
server:
  address:     ":9899"
  openapiPath: "/api.json"
  swaggerPath: "/swagger"

# https://goframe.org/docs/core/glog-config
logger:
  level : "all"
  stdout: true

# The database (SQLite) is configured programmatically in internal/store so
# that `go run main.go` works without any config file. The default file is
# gopher_agent.db under the data root (working directory, or GOPHER_DATA_DIR).
